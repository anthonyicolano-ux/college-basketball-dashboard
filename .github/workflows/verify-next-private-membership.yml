name: Verify next private basketball membership evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  membership-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify independent conference roster evidence (offline)
        run: python scripts/verify_next_private_membership.py
