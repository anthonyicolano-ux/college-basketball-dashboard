name: Publish expanded private basketball teams (approval gated)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to password-protected Cloudflare KV (default false)'
        required: true
        type: boolean
        default: false
      approval:
        description: 'For publication type exactly I APPROVE 24 TEAM PRIVATE KV PUBLICATION'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest discover -s tests
      - name: Validate and optionally publish private 24-team dataset
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLISH_EXPANDED_KV: ${{ inputs.publish }}
          PUBLICATION_APPROVAL: ${{ inputs.approval }}
        run: python scripts/publish_expanded_private_team_kv.py
