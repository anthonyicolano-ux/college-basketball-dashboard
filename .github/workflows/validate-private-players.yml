name: Validate private basketball player statistics (dry run)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-players:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest discover -s tests
      - name: Validate approved private player coverage (one API request; no publication)
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python scripts/dry_run_private_players.py
