name: Basketball provider credentials preflight (no API calls)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Check presence only, never reveal secret values
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          if [ -n "$CBBD_API_KEY" ]; then
            echo "CBBD_API_KEY: configured"
          else
            echo "::warning::CBBD_API_KEY: missing"
          fi
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_KV_NAMESPACE_ID" ]; then
            echo "Cloudflare KV publisher credentials: configured"
          else
            echo "::warning::Cloudflare KV publisher credentials: incomplete"
          fi
          echo "No provider requests or Cloudflare writes were performed."
