name: Dry run expanded private basketball team coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-expanded-teams:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest discover -s tests
      - name: Validate expanded private team preview (one API request; no publication)
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python scripts/dry_run_expanded_private_teams.py
