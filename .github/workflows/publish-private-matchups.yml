name: Validate or publish private matchup schedule
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to protected Cloudflare KV after validation'
        type: boolean
        required: true
        default: false
      approval:
        description: 'Exact publication approval phrase (only for publish=true)'
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  validate-matchups:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest discover -s tests
      - name: Validate or publish private schedule
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLISH_PRIVATE_MATCHUPS: ${{ inputs.publish }}
          PUBLICATION_APPROVAL: ${{ inputs.approval }}
        run: python scripts/publish_private_matchups_kv.py
