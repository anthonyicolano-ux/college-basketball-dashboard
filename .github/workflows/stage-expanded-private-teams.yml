name: Stage expanded private basketball team payload (dry run)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-expanded-teams:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest discover -s tests
      - name: Stage expanded private KV payload in memory (one API request; no publication)
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          PUBLISH_EXPANDED_KV: 'false'
        run: python scripts/stage_expanded_private_team_kv.py
