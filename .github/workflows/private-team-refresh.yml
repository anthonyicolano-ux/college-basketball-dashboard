# Manual only. One CBBD request per run. Publishing is blocked until
# explicit rights clearance is separately confirmed and enabled in code.
name: Dry run private basketball team refresh
on:
  workflow_dispatch:
    inputs:
      publish_pilot:
        description: 'Publish one-team pilot to private KV?'
        type: boolean
        default: false
      rights_confirmation:
        description: 'If publishing, enter: I CONFIRM PRIVATE DATA DISPLAY IS PERMITTED'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: private-team-refresh
  cancel-in-progress: false

jobs:
  validate-team:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline tests (no API requests)
        run: python -m unittest discover -s tests -v
      - name: Offline multi-conference comparison pilot (synthetic data only)
        run: |
          python - <<'PY'
          from scripts.validate_multi_team_pilot import validate_rows
          teams = [
              ('Duke', 'ACC', 82, 71, 117, 100),
              ('Kansas', 'Big 12', 79, 72, 112, 103),
              ('UConn', 'Big East', 77, 69, 110, 98),
              ('Gonzaga', 'WCC', 85, 74, 120, 105),
          ]
          rows = [
              dict(team=name, conference=conf, games=3, wins=2, losses=1,
                   ppg=ppg, oppPpg=opp, offRating=off, defRating=defense,
                   netRating=off-defense, scoringMargin=ppg-opp)
              for name, conf, ppg, opp, off, defense in teams
          ]
          result = validate_rows(rows)
          assert result == {'teams': 4, 'conferences': 4, 'publication': 'DISABLED'}
          assert sorted(rows, key=lambda x: x['netRating'], reverse=True)[0]['team'] == 'Duke'
          assert len({r['conference'] for r in rows if r['conference'] == 'ACC'}) == 1
          print('PASS: 4 synthetic teams, 4 conferences, sorting and filtering; no provider data or KV writes.')
          PY
      - name: Validate or publish one-team pilot (one API request)
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLISH_PRIVATE_KV: ${{ inputs.publish_pilot }}
          PUBLICATION_APPROVAL: ${{ inputs.rights_confirmation }}
        run: python scripts/refresh_private_team_kv.py
