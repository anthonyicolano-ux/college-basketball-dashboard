# Manual only. One CBBD request per run. Publishing is blocked until
# explicit rights clearance is separately confirmed and enabled in code.
name: Dry run private basketball team refresh
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-team:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests (no API requests)
        run: python -m unittest discover -s tests -v
      - name: Prepare private KV upload in dry-run mode (one API request)
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          PUBLISH_PRIVATE_KV: 'false'
        run: python scripts/refresh_private_team_kv.py
