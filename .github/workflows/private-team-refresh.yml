# Manual only. One CBBD request per run. Publishing is blocked until
# explicit rights clearance is separately confirmed and enabled in code.
name: Dry run private basketball team refresh
on:
  workflow_dispatch:
    inputs:
      publish_pilot:
        description: 'Publish one-team pilot to private KV?'
        type: boolean
        default: false
      rights_confirmation:
        description: 'If publishing, enter: I CONFIRM PRIVATE DATA DISPLAY IS PERMITTED'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: private-team-refresh
  cancel-in-progress: false

jobs:
  validate-team:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests (no API requests)
        run: python -m unittest discover -s tests -v
      - name: Validate or publish one-team pilot (one API request)
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLISH_PRIVATE_KV: ${{ inputs.publish_pilot }}
          PUBLICATION_APPROVAL: ${{ inputs.rights_confirmation }}
        run: python scripts/refresh_private_team_kv.py
