name: Prepare provisional basketball staging (offline only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'private-site/build_provisional_staging_manifest.py'
      - 'private-site/test_build_provisional_staging_manifest.py'
      - 'references/2026_27_mbb_school_evidence_matrix.json'
      - '.github/workflows/prepare-provisional-basketball-staging.yml'

permissions:
  contents: read

jobs:
  offline-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run provisional staging tests (no network or secrets)
        run: python -m unittest discover -s private-site -p 'test_build_provisional_staging_manifest.py'
      - name: Prepare unapproved review manifest
        run: |
          python private-site/build_provisional_staging_manifest.py --out "$RUNNER_TEMP/provisional"
          cat "$RUNNER_TEMP/provisional/staging-readiness.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload non-sensitive candidate review only
        uses: actions/upload-artifact@v4
        with:
          name: provisional-candidate-review
          path: |
            ${{ runner.temp }}/provisional/candidate-review.csv
            ${{ runner.temp }}/provisional/staging-readiness.json
          retention-days: 7
