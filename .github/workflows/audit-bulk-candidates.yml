name: Audit basketball bulk candidate matching

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-bulk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest discover -s tests
      - name: Bulk candidate reconciliation (one API request; no publishing)
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python scripts/audit_bulk_candidate_matching.py
