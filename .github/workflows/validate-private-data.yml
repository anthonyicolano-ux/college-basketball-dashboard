name: Validate private basketball data code
on:
  pull_request:
    paths:
      - 'private-site/validate_full_coverage.py'
      - 'private-site/test_validate_full_coverage.py'
      - '.github/workflows/validate-private-data.yml'
      - 'private-site/worker.js'
      - 'private-site/worker.test.mjs'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic validation tests
        run: python -m unittest discover -s private-site -p 'test_validate_full_coverage.py' -v
      - name: Run Worker route tests
        run: node --test private-site/worker.test.mjs
