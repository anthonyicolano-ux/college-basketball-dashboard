name: Validate real four-team basketball pilot
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-multi-team-validation
  cancel-in-progress: false

jobs:
  validate-four-teams:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate four real teams (one CBBD request; no publication)
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python scripts/dry_run_real_multi_team.py
